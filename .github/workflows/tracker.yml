name: tracker
# 15분마다: Steam 기록 + 처리 안 된 30분 창 수집(최근 2시간 내 빈 창은 몰아서 채움) + 대시보드 배포.
# 데이터는 data 브랜치(커밋 누적), 대시보드는 GitHub Pages(Actions 배포).
on:
  schedule:
    # 예약 실행은 '일정을 마지막으로 바꾼 커밋 작성자' 권한으로 돈다. 작성자가 실제 GitHub 계정이 아니면
    # 예약 실행이 아예 시작되지 않는다(2026-10-08, game-tracker 이름으로 커밋했을 때 75분간 0회).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency:
  group: tracker
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: data 브랜치 가져오기
        run: |
          git config --global user.name "game-tracker"
          git config --global user.email "game-tracker@users.noreply.github.com"
          if git fetch -q --depth=1 origin data; then
            git worktree add -q data FETCH_HEAD && (cd data && git checkout -q -B data)
          else
            mkdir -p data && cd data && git init -q -b data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Claude Code (AI 분류용, 구독 토큰이 있을 때)
        if: ${{ env.HAS_OAUTH == 'true' }}
        run: npm install -g -s @anthropic-ai/claude-code
      - name: 수집
        id: track
        continue-on-error: true
        env:
          TRACKER_CLOUD: '1'
          TZ: Asia/Seoul
          LABELS_KEY: ${{ secrets.LABELS_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tracker.py cloud
      - name: 데이터 저장
        if: always()
        run: |
          cd data
          printf 'labels_cache.json\nlabel_reasons.jsonl\nuser_lexicon.json\n.lock\n*.tmp\nbackup/\npublic/\n' > .gitignore
          git add -A
          git diff --cached --quiet || git commit -q -m "data $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          if git remote get-url origin >/dev/null 2>&1; then git push -q origin HEAD:data; else
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data; fi
      - uses: actions/upload-pages-artifact@v3
        if: always() && hashFiles('site/index.html') != ''
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: always() && hashFiles('site/index.html') != ''
      - name: 수집 실패 표시
        if: steps.track.outcome == 'failure'
        run: exit 1
